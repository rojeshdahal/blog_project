<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <nav class="bg-white shadow-md border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-6 py-4">
            <div class="flex gap-4 items-center flex-wrap">
                <a href="/" class="bg-gradient-to-r from-slate-800 to-slate-900 hover:from-slate-700 hover:to-slate-800 text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                    Home
                </a>

                {% if user.is_authenticated %}
                    <a href="/accounts/profile/edit/" class="bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                        Profile
                    </a>

                    <a href="/create/" class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                        + Create Post
                    </a>

                    <form action="/accounts/logout/" method="POST" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="/accounts/login/" class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                        Login
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-6">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
