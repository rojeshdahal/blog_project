{% if user.is_authenticated %}

    <p>
        Welcome, {{ user.username }}
    </p>

    <a href="/create/">
        Create Post
    </a>

    <br><br>

    <form action="/accounts/logout/" method="POST">
        {% csrf_token %}
        <button type="submit">
            Logout
        </button>
    </form>

{% else %}

    <a href="/accounts/login/">
        Login
    </a>

    <a href="/accounts/register/">
        Register
    </a>

{% endif %}

<hr>
