<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>

    <h1>My Blog Posts</h1>

    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>

            <p>{{ post.content }}</p>

            <small>
                Author: {{ post.author }}
            </small>

            <br>

            <small>
                Published: {{ post.created_at }}
            </small>

            <hr>
        </div>

    {% endfor %}

</body>
</html>
