<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>
</head>
<body>
    {% extends 'base.html' %}

    {% block content %}
    <h1>Create Post</h1>
    <br>

    <form method="POST">

        {% csrf_token %}

        {% for field in form %}
        <div class="flex flex-col">
            
            <label for="{{ field.id_for_label }}" class="text-sm font-semibold text-gray-700 mb-1">
                {{ field.label }}
            </label>
            
            <div class="relative">
                {{ field }}
            </div>

            {% if field.help_text %}
                <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
            {% endif %}

            {% for error in field.errors %}
                <p class="text-xs text-red-500 font-medium mt-1">⚠️ {{ error }}</p>
            {% endfor %}
        </div>
    {% endfor %}

   
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 mt-2">
        Submit
    </button>

    </form>
    {% endblock %}
</body>
</html>
