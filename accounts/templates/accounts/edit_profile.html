{% extends 'base.html' %}

{% block content %}

<h1 class="text-3xl font-bold mb-6">
    Edit Profile
</h1>

<form
    method="POST"
    enctype="multipart/form-data"
    class="bg-white p-6 rounded shadow"
>

    {% csrf_token %}

    {{ form.as_p }}

    <button
        class="bg-blue-500 text-white px-4 py-2 rounded"
    >
        Save Profile
    </button>

</form>

{% endblock %}
